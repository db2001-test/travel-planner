
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travel Planner">
<title>Travel Planner</title>
<link rel="manifest" href="./manifest.json">

<style>
:root {
  color-scheme: light dark;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: #f3f5f7;
  color: #1c2933;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

h2 { font-size: 19px; margin: 0; }
small { color: #687681; }

button {
  border: 1px solid #ccd4da;
  background: white;
  color: #253746;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 600;
}

.primary {
  background: #234e68;
  color: white;
  border-color: #234e68;
}

.toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 9px;
}

.toolbar button:first-child { flex: 1; }

.entry {
  background: white;
  border: 1px solid #dce2e7;
  border-radius: 7px;
  padding: 7px;
  margin-bottom: 13px;
}

/* Narrower dates */
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 112px 112px;
  gap: 5px;
}

/* Narrower cost fields */
.costs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 95px));
  gap: 7px;
  margin-top: 6px;
}

.bottom {
  display: flex;
  gap: 5px;
  align-items: end;
  margin-top: 6px;
}

.bottom .note-field {
  flex: 1;
  min-width: 0;
}

label {
  font-size: 9px;
  color: #64717c;
  display: block;
  margin-bottom: 2px;
}

input {
  width: 100%;
  min-width: 0;
  height: 29px;
  padding: 3px 5px;
  border: 1px solid #d5dce1;
  border-radius: 4px;
  background: white;
  color: #172d3d;
  font-size: 11px;
}

/* Bold green destination */
input[data-key="dest"] {
  color: #16803c;
  font-weight: 800;
  font-size: 13px;
}

/* Bold green total */
.total {
  font-size: 14px;
  font-weight: 800;
  color: #16803c;
  white-space: nowrap;
  padding: 5px 2px;
}

.actions {
  display: flex;
  gap: 4px;
  margin-top: 7px;
}

.actions button { padding: 5px 8px; }

.actions .move {
  font-size: 15px;
  min-width: 30px;
}

.actions .delete { margin-left: auto; }

.status {
  font-size: 10px;
  color: #64717c;
  margin-top: 8px;
}

/* Smaller screens */
@media(max-width: 370px) {
  .top {
    grid-template-columns: minmax(0, 1fr) 105px 105px;
    gap: 4px;
  }

  .costs {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* Dark mode */
@media(prefers-color-scheme:dark) {
  body {
    background: #101b23;
    color: #edf2f5;
  }

  .entry {
    background: #1b2a35;
    border-color: #354550;
  }

  button {
    background: #263743;
    color: #edf2f5;
    border-color: #43535e;
  }

  input {
    background: #263743;
    color: white;
    border-color: #43535e;
  }

  label, small, .status { color: #aab8c2; }

  .primary { background: #477b9a; }

  input[data-key="dest"], .total {
    color: #55d486;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h2>✈ Travel Planner</h2>
    <small id="count">0 destinations</small>
  </div>
  <small>● Saved locally</small>
</header>

<div class="toolbar">
  <button class="primary" id="add">＋ Add row</button>
  <button id="export">↓ CSV</button>
  <button id="copy">Copy</button>
</div>

<main id="rows"></main>

<div id="empty" class="status">
  No destinations yet. Tap Add row to begin.
</div>

<div class="status" id="status">
  Changes save automatically.
</div>

<script>
const KEY = 'travel-planner-data';
let rows = [];

try {
  rows = JSON.parse(localStorage.getItem(KEY) || '[]');
  if (!Array.isArray(rows)) rows = [];
} catch(e) {
  rows = [];
}

const $ = id => document.getElementById(id);

const money = n => Number(n || 0).toFixed(2);

const total = r =>
  ['flight','lo','accom'].reduce(
    (s,k) => s + (Number(r[k]) || 0), 0
  );

const esc = s =>
  String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

function field(r,k,label,type='text',placeholder='') {
  return `
    <div class="${k === 'note' ? 'note-field' : ''}">
      <label>${label}</label>
      <input
        data-id="${esc(r.id)}"
        data-key="${k}"
        type="${type}"
        value="${esc(r[k] ?? '')}"
        placeholder="${placeholder}"
        ${type === 'number'
          ? 'min="0" step=".01" inputmode="decimal"'
          : ''}
      >
    </div>`;
}

function render() {
  $('count').textContent = rows.length + ' destinations';
  $('empty').style.display = rows.length ? 'none' : 'block';

  $('rows').innerHTML = rows.map((r,i) => `
    <section class="entry">

      <div class="top">
        ${field(r,'dest','Dest','text','Airport')}
        ${field(r,'start','From','date')}
        ${field(r,'end','To','date')}
      </div>

      <div class="costs">
        ${field(r,'flight','Flight $','number','0')}
        ${field(r,'lo','LO $','number','0')}
        ${field(r,'accom','Accom $','number','0')}
      </div>

      <div class="bottom">
        ${field(r,'note','Note','text','Notes')}
        <div class="total">$${money(total(r))}</div>
      </div>

      <div class="actions">
        <button class="move"
          data-action="up"
          data-id="${esc(r.id)}"
          ${i === 0 ? 'disabled' : ''}>↑</button>

        <button class="move"
          data-action="down"
          data-id="${esc(r.id)}"
          ${i === rows.length - 1 ? 'disabled' : ''}>↓</button>

        <button data-action="duplicate"
          data-id="${esc(r.id)}">＋ Copy</button>

        <button data-action="edit"
          data-id="${esc(r.id)}">Edit</button>

        <button class="delete"
          data-action="delete"
          data-id="${esc(r.id)}">Delete</button>
      </div>

    </section>
  `).join('');
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(rows));
    $('status').textContent = '✓ Saved on this device';
  } catch(e) {
    $('status').textContent =
      'Storage unavailable. Please export a backup.';
  }
}

function add() {
  const p = rows[rows.length - 1] || {};

  rows.push({
    id: crypto.randomUUID(),
    dest: '',
    start: p.start || '',
    end: p.end || '',
    flight: '',
    lo: '',
    accom: '',
    note: ''
  });

  save();
  render();
}

function csv() {
  const q = v =>
    '"' + String(v ?? '').replace(/"/g,'""') + '"';

  return [
    [
      'Dest','Start date','End date',
      'Flight $','LO $','Accom $',
      'Note','Total $'
    ],
    ...rows.map(r => [
      r.dest,r.start,r.end,
      r.flight,r.lo,r.accom,
      r.note,money(total(r))
    ])
  ].map(r => r.map(q).join(',')).join('\r\n');
}

function exportCSV() {
  const blob = new Blob(
    ['\ufeff' + csv()],
    {type:'text/csv;charset=utf-8'}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'Travel-Planner.csv';
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('add').onclick = add;
$('export').onclick = exportCSV;

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(csv());
    $('status').textContent = 'CSV copied.';
  } catch(e) {
    $('status').textContent = 'Please use CSV export.';
  }
};

/* Update fields */
$('rows').addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.id) return;

  const r = rows.find(x => x.id === t.dataset.id);
  if (!r) return;

  r[t.dataset.key] = t.value;

  if (t.dataset.key === 'start') {
    if (r.end && r.end < t.value) r.end = '';

    save();
    render();

    /* Automatically activate To date */
    const next = [...document.querySelectorAll(
      'input[data-key="end"]'
    )].find(x => x.dataset.id === r.id);

    if (next) {
      next.min = r.start || '';
      next.focus();

      if (typeof next.showPicker === 'function') {
        try {
          next.showPicker();
        } catch(e) {
          // iOS may restrict automatic date picker opening
        }
      }
    }

    return;
  }

  save();
  render();
});

/* Update totals while typing */
$('rows').addEventListener('input', e => {
  const t = e.target;

  if (!t.dataset.id || t.type === 'date') return;

  const r = rows.find(x => x.id === t.dataset.id);
  if (!r) return;

  r[t.dataset.key] = t.value;
  save();

  const card = t.closest('.entry');
  const sum = card.querySelector('.total');

  sum.textContent = '$' + money(total(r));
});

/* Buttons: reorder, duplicate, edit, delete */
$('rows').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;

  const i = rows.findIndex(r => r.id === b.dataset.id);
  if (i < 0) return;

  const action = b.dataset.action;

  if (action === 'up' && i > 0) {
    [rows[i-1],rows[i]] = [rows[i],rows[i-1]];
  }

  if (action === 'down' && i < rows.length-1) {
    [rows[i],rows[i+1]] = [rows[i+1],rows[i]];
  }

  if (action === 'delete') {
    if (!confirm('Delete this destination?')) return;
    rows.splice(i,1);
  }

  if (action === 'duplicate') {
    rows.splice(i+1,0,{
      ...rows[i],
      id: crypto.randomUUID()
    });
  }

  if (action === 'edit') {
    const v = prompt('Airport code:',rows[i].dest);
    if (v === null) return;
    rows[i].dest = v.trim().toUpperCase();
  }

  save();
  render();
});

/* Service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('./service-worker.js')
      .catch(() => {});
  });
}

render();
</script>

</body>
</html>

</html>
