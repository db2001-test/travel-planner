
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travel Planner">
<title>Travel Planner</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f3f5f7;color:#1c2933}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h2{font-size:19px;margin:0}
small{color:#687681}
button{border:1px solid #ccd4da;background:white;color:#253746;border-radius:6px;padding:7px 10px;font-size:12px;font-weight:600}
.primary{background:#234e68;color:white;border-color:#234e68}
.toolbar{display:flex;gap:6px;margin-bottom:9px}
.toolbar button:first-child{flex:1}
.entry{background:white;border:1px solid #dce2e7;border-radius:7px;padding:6px;margin-bottom:6px}
.top{display:grid;grid-template-columns:.72fr 1fr 1fr;gap:5px}
.costs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:5px}
.bottom{display:flex;gap:5px;align-items:center;margin-top:5px}
.bottom input{flex:1;min-width:0}
label{font-size:9px;color:#64717c;display:block;margin-bottom:2px}
input{width:100%;min-width:0;height:29px;padding:3px 5px;border:1px solid #d5dce1;border-radius:4px;background:white;color:#172d3d;font-size:11px}
.total{font-size:12px;font-weight:700;white-space:nowrap;padding:4px}
.actions{display:flex;gap:3px}
.actions button{padding:5px 7px}
.status{font-size:10px;color:#64717c;margin-top:8px}
@media(prefers-color-scheme:dark){
 body{background:#101b23;color:#edf2f5}
 .entry{background:#1b2a35;border-color:#354550}
 button{background:#263743;color:#edf2f5;border-color:#43535e}
 input{background:#263743;color:white;border-color:#43535e}
 label,small,.status{color:#aab8c2}
 .primary{background:#477b9a}
}
</style>
</head>
<body>
<header>
 <div><h2>✈ Travel Planner</h2><small id="count">0 destinations</small></div>
 <small>● Saved locally</small>
</header>
<div class="toolbar">
 <button class="primary" id="add">＋ Add row</button>
 <button id="export">↓ CSV</button>
 <button id="copy">Copy</button>
</div>
<main id="rows"></main>
<div id="empty" class="status">No destinations yet. Tap Add row to begin.</div>
<div class="status" id="status">Changes save automatically.</div>
<script>
const KEY='travel-planner-data';
let rows=[];
try{rows=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch(e){rows=[]}
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toFixed(2);
const total=r=>['flight','lo','accom'].reduce((s,k)=>s+(Number(r[k])||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(r,k,label,type='text',placeholder=''){
 return `<div><label>${label}</label><input data-id="${esc(r.id)}" data-key="${k}" type="${type}" value="${esc(r[k]||'')}" placeholder="${placeholder}" ${type==='number'?'min="0" step=".01" inputmode="decimal"':''}></div>`;
}
function render(){
 $('count').textContent=rows.length+' destinations';
 $('empty').style.display=rows.length?'none':'block';
 $('rows').innerHTML=rows.map((r,i)=>`
 <section class="entry">
  <div class="top">
   ${field(r,'dest','Dest','text','Airport')}
   ${field(r,'start','From','date')}
   ${field(r,'end','To','date')}
  </div>
  <div class="costs">
   ${field(r,'flight','Flight $','number','0')}
   ${field(r,'lo','LO $','number','0')}
   ${field(r,'accom','Accom $','number','0')}
  </div>
  <div class="bottom">
   ${field(r,'note','Note','text','Notes')}
   <div class="total">$${money(total(r))}</div>
  </div>
  <div class="actions" style="margin-top:5px">
   <button data-action="duplicate" data-id="${esc(r.id)}">＋ Copy</button>
   <button data-action="edit" data-id="${esc(r.id)}">Edit</button>
   <button data-action="delete" data-id="${esc(r.id)}">Delete</button>
  </div>
 </section>`).join('');
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(rows));$('status').textContent='✓ Saved on this device'}
 catch(e){$('status').textContent='Storage unavailable. Please export a backup.'}
}
function add(){
 const p=rows[rows.length-1]||{};
 rows.push({id:crypto.randomUUID(),dest:'',start:p.start||'',end:p.end||'',flight:'',lo:'',accom:'',note:''});
 save();render();
}
function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 return [['Dest','Start date','End date','Flight $','LO $','Accom $','Note','Total $'],
 ...rows.map(r=>[r.dest,r.start,r.end,r.flight,r.lo,r.accom,r.note,money(total(r))])]
 .map(r=>r.map(q).join(',')).join('\r\n');
}
function exportCSV(){
 const blob=new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='Travel-Planner.csv';a.click();
 URL.revokeObjectURL(url);
}
$('add').onclick=add;
$('export').onclick=exportCSV;
$('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText(csv());$('status').textContent='CSV copied.'}
 catch(e){$('status').textContent='Please use CSV export.'}
};
$('rows').addEventListener('change',e=>{
 const t=e.target;if(!t.dataset.id)return;
 const r=rows.find(x=>x.id===t.dataset.id);if(!r)return;
 r[t.dataset.key]=t.value;
 if(t.dataset.key==='start'&&r.end&&r.end<t.value)r.end='';
 save();render();
});
$('rows').addEventListener('input',e=>{
 const t=e.target;if(!t.dataset.id||t.type==='date')return;
 const r=rows.find(x=>x.id===t.dataset.id);if(!r)return;
 r[t.dataset.key]=t.value;
 save();
 const card=t.closest('.entry');
 const sum=card.querySelector('.total');
 sum.textContent='$'+money(total(r));
});
$('rows').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const i=rows.findIndex(r=>r.id===b.dataset.id);if(i<0)return;
 if(b.dataset.action==='delete'){
  if(!confirm('Delete this destination?'))return;
  rows.splice(i,1);
 }
 if(b.dataset.action==='duplicate'){
  rows.splice(i+1,0,{...rows[i],id:crypto.randomUUID()});
 }
 if(b.dataset.action==='edit'){
  const v=prompt('Airport code:',rows[i].dest);
  if(v===null)return;
  rows[i].dest=v.trim().toUpperCase();
 }
 save();render();
});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
render();
</script>
</body>
</html>
